<style>
:root{--ink:#e8f0ff;--gold:#f8d030;--goldD:#b08810}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:'Press Start 2P',ui-monospace,monospace;font-size:10px;line-height:1.6;user-select:none;-webkit-user-select:none;
 background:#0c1222;background-image:radial-gradient(ellipse at 50% -10%,#24406a 0%,#0c1222 62%),repeating-linear-gradient(45deg,#ffffff05 0 2px,transparent 2px 8px)}
canvas,.ico{image-rendering:pixelated;image-rendering:crisp-edges}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:12px 10px}
.screen.on{display:flex}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
h1{margin:14px 0 2px;font-size:24px;color:#cfefff;text-shadow:3px 3px 0 #1d4f8a,6px 6px 0 #0b1426;letter-spacing:1px}
.sub{color:#9ab8dc;margin:6px 0 14px;text-align:center;font-size:9px}
.pbtn{font-family:inherit;font-size:10px;color:#fff;background:#3a5a8c;border:0;padding:10px 11px;border-radius:3px;cursor:pointer;line-height:1.3;
 box-shadow:inset -3px -3px 0 #23406a,inset 3px 3px 0 #6088c0,0 0 0 3px #0b1222}
.pbtn:active{transform:translateY(2px)}
.pbtn.gold{background:var(--gold);color:#2a1e00;box-shadow:inset -3px -3px 0 var(--goldD),inset 3px 3px 0 #fff2a0,0 0 0 3px #0b1222}
.pbtn.red{background:#c84040;box-shadow:inset -3px -3px 0 #802020,inset 3px 3px 0 #f08080,0 0 0 3px #0b1222}
.pbtn.on{background:#2a9a6a;box-shadow:inset -3px -3px 0 #1a6a48,inset 3px 3px 0 #70d8a8,0 0 0 3px #0b1222}
.pbtn.sm{padding:8px 8px;font-size:9px}
.world{width:100%;max-width:400px;margin-bottom:14px;background:#1c2a48;border:3px solid #0b1222;box-shadow:inset 0 0 0 3px #3a5a8c;border-radius:4px;padding:10px}
.wh{display:flex;justify-content:space-between;margin-bottom:10px;color:#cfefff}.wh .st{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.lv{font-family:inherit;aspect-ratio:1;border:0;border-radius:3px;color:#173050;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
 background:#bfe6fa;box-shadow:inset -3px -3px 0 #84c0e4,inset 3px 3px 0 #fff,0 0 0 2px #0b1222}
.lv small{font-size:7px;color:#c08800;letter-spacing:-1px}
.lv:disabled{background:#4a5a78;color:#2a3450;box-shadow:inset -3px -3px 0 #3a4864,0 0 0 2px #0b1222}
.lv:disabled small{color:transparent}
.mrowb{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:4px 0 18px}
/* Spiel */
.hud{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hud .t{font-size:11px;text-align:center;flex:1;color:#cfefff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat{font-size:9px;text-align:right;white-space:nowrap}
.items{color:#ff8ad8;margin-right:6px}.items.done{color:#7fe8a8}
.cubefx{position:absolute;left:0;top:0;z-index:3;image-rendering:pixelated}
.splash.pink{border-color:#ff8ad8}
.badge{margin-top:8px;font-size:8px;color:#5ee1ff;border:2px solid #5ee1ff;padding:3px 6px;border-radius:3px}
.area{flex:1;width:100%;display:flex;align-items:center;justify-content:center;touch-action:none;position:relative;min-height:0}
.board{position:relative;filter:drop-shadow(0 12px 20px #000c)}
.inner{position:absolute;overflow:hidden}
.inner canvas{position:absolute;left:0;top:0;image-rendering:pixelated}

.board canvas{position:absolute;left:0;top:0}
.board.wrapon{animation:wr 1.4s infinite alternate}
@keyframes wr{from{filter:drop-shadow(0 0 6px #7ffcff)}to{filter:drop-shadow(0 0 1px #2a8aaa)}}
#gPl{z-index:3;transform-origin:50% 50%;will-change:transform}
.harrow{position:absolute;z-index:4;font-family:system-ui,sans-serif;font-weight:900;text-align:center;color:#ff4d7a;text-shadow:2px 2px 0 #fff;animation:bl .4s 5 alternate;pointer-events:none}
@keyframes bl{to{opacity:.15}}
.splash{position:absolute;z-index:4;border-radius:50%;border:3px solid #cfe8ff;animation:sp .6s forwards;pointer-events:none}
@keyframes sp{from{transform:scale(.2)}to{transform:scale(1.6);opacity:0}}
.bar{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.tbox{background:#f8f8f8;color:#283040;border:4px solid #4a78a8;border-radius:6px;box-shadow:0 0 0 3px #f8f8f8,0 0 0 6px #283850;padding:12px 14px;line-height:1.8}
#say{position:absolute;left:10px;right:10px;bottom:62px;z-index:8;opacity:0;transition:opacity .25s;pointer-events:none;max-width:500px;margin:auto}
#say.on{opacity:1}.tri{float:right;color:#e04848;animation:bl .5s infinite alternate}
/* Dialog */
#dlg{position:fixed;inset:0;background:#05081499;display:none;align-items:flex-end;justify-content:center;z-index:20;padding:18px 14px 24px}
#dlg.on{display:flex}
#dlgBox{width:100%;max-width:440px;max-height:85vh;overflow-y:auto}
#dlgBox.center{text-align:center}
#dlgBox.sheet{max-width:440px}
#dlgBox.tall{max-height:80vh}
#dlgBtns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
#dlgBox.center #dlgBtns{justify-content:center}
.dt{font-size:12px;margin-bottom:10px;color:#1d4f8a}
.stars{font-size:30px;color:#f0b000;letter-spacing:6px;margin:6px 0 10px;text-shadow:2px 2px 0 #8a6000}.stars .off{color:#c8ccd4;text-shadow:none}
.sol{margin-top:8px;font-size:14px;letter-spacing:2px;color:#1d4f8a;word-break:break-all;font-family:system-ui,sans-serif}
.lg{display:flex;gap:10px;align-items:center;margin:8px 0;font-size:9px}.lg b{color:#1d4f8a}
.ico{flex:none;box-shadow:0 0 0 2px #283850}
.wico{width:28px;height:28px;flex:none;background:#5ee1ff;color:#0b1222;display:flex;align-items:center;justify-content:center;font-size:16px;font-family:system-ui;box-shadow:0 0 0 2px #283850}
.fld{display:flex;align-items:center;gap:10px;margin:10px 0}.fld span{width:60px}.fld input[type=range]{flex:1;accent-color:#3a5a8c}.fld b{width:24px;text-align:right}
.seg{display:flex;gap:8px}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:9px}
.szg{display:grid;grid-template-columns:1fr auto auto;gap:10px 8px;align-items:center;margin:6px 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
textarea{width:100%;height:90px;margin-top:10px;font-family:ui-monospace,monospace;font-size:11px;border:3px solid #4a78a8;border-radius:4px;padding:6px;user-select:text;-webkit-user-select:text}
textarea.bad{border-color:#c84040}
/* Editor */
.ehead{width:100%;max-width:560px;display:flex;gap:8px;align-items:center}
#eName{flex:1;min-width:0;font-family:inherit;font-size:10px;padding:9px 8px;border:3px solid #0b1222;border-radius:3px;background:#f8f8f8;color:#283040;user-select:text;-webkit-user-select:text}
.etools{width:100%;max-width:560px;display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:10px}
.etools .pbtn{padding:6px 2px;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:system-ui,sans-serif}
.etools .pbtn small{font-family:'Press Start 2P',monospace;font-size:6px}
#eBoard{touch-action:none;cursor:crosshair}
#eIn::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background-image:linear-gradient(#0b122230 1px,transparent 1px),linear-gradient(90deg,#0b122230 1px,transparent 1px);background-size:var(--T) var(--T)}
#eStat{font-size:8px;color:#9ab8dc;margin-top:8px;text-align:center;min-height:13px}.warn{color:#ff9a7a}

<script>
// ===== Engine =====
const DR=[-1,1,0,0],DC=[0,0,-1,1],OPP=[1,0,3,2]; // 0 hoch,1 runter,2 links,3 rechts
const ARROW={'^':0,'v':1,'<':2,'>':3};
const DSPIKE={n:0,s:1,w:2,e:3};               // Richtungsstacheln: Spitzen zeigen in diese Richtung
const TELE='ABC',WALL='#kK';
const MELT=6;                                 // schmelzendes Eis: nach so vielen Zügen ist es ein Loch
const VALID='#._SG~u%^v<>ABCkKox*mqlOnsewz1234r';
const SBLOCK={'1':0,'2':1,'3':2,'4':3}; // Stachelblock: Stacheln zeigen nach oben/unten/links/rechts
// Felder: # k K Eisbrocken, . Eis, _ Stein, S Start, G Ziel, ~ tiefes Loch, u flaches Loch, % rissiges Eis,
// ^v<> Pfeile, ABC Teleporter, o Eisblock, O großer Eisblock, x Stacheln, nsew Richtungsstacheln,
// * Kristall, m schmelzendes Eis, q Schlüssel, l Schloss, z markierter Boden (nur Bau-Modus, wirkt wie Eis)
// 1-4 schiebbarer Stachelblock (Stacheln oben/unten/links/rechts), r Bröckelwand (zerbröselt beim Anstoßen zu Stacheln)
function prep(L){
  const g=L.map.map(r=>r.split(''));const H=g.length,W=g[0].length;
  let start=null,goal=null;const tp={},crack=new Map(),items=new Map(),water=new Map(),keys=new Map(),locks=new Map(),brittle=new Map(),melt=new Set(),cubes=[],cubes2=[],cubes3=[];
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){const ch=g[r][c],i=r*W+c;
    if(ch==='S')start=[r,c];else if(ch==='G')goal=[r,c];
    else if(TELE.includes(ch))(tp[ch]=tp[ch]||[]).push([r,c]);
    else if(ch==='%')crack.set(i,crack.size);
    else if(ch==='*')items.set(i,items.size);
    else if(ch==='u')water.set(i,water.size);
    else if(ch==='q')keys.set(i,keys.size);
    else if(ch==='l')locks.set(i,locks.size);
    else if(ch==='m')melt.add(i);
    else if(ch==='o'){cubes.push(i);g[r][c]='.'}
    else if(ch==='O'){cubes2.push(i);g[r][c]='.'}
    else if(ch in SBLOCK){cubes3.push(i*4+SBLOCK[ch]);g[r][c]='.'}
    else if(ch==='r')brittle.set(i,brittle.size);
    else if(ch==='z')g[r][c]='.'}
  const partner=new Map();
  for(const k in tp)if(tp[k].length===2){const[a,b]=tp[k];partner.set(a[0]*W+a[1],b);partner.set(b[0]*W+b[1],a)}
  cubes3.sort((a,b)=>a-b);return{g,H,W,wrap:!!L.wrap,start,goal,partner,crack,items,water,keys,locks,brittle,melt,cubes0:cubes,cubes20:cubes2,cubes30:cubes3,tp};
}
const z=n=>new Array(n).fill(0);
function initState(P){return{r:P.start[0],c:P.start[1],br:z(P.crack.size),it:z(P.items.size),fl:z(P.water.size),ky:z(P.keys.size),lk:z(P.locks.size),rb:z(P.brittle.size),kh:0,mv:0,cb:P.cubes0.slice(),cb2:P.cubes20.slice(),cb3:P.cubes30.slice()}}
function cloneSt(s){return{r:s.r,c:s.c,br:s.br.slice(),it:s.it.slice(),fl:s.fl.slice(),ky:s.ky.slice(),lk:s.lk.slice(),rb:s.rb.slice(),kh:s.kh,mv:s.mv,cb:s.cb.slice(),cb2:s.cb2.slice(),cb3:s.cb3.slice()}}
function skey(s){return s.r+','+s.c+'|'+s.br.join('')+s.it.join('')+s.fl.join('')+s.ky.join('')+s.lk.join('')+s.rb.join('')+s.kh+'|'+s.mv+'|'+s.cb.join(',')+'|'+s.cb2.join(',')+'|'+s.cb3.join(',')}
function nxt(P,r,c,d){let nr=r+DR[d],nc=c+DC[d],wrap=false;
  if(nr<0||nc<0||nr>=P.H||nc>=P.W){if(!P.wrap)return null;nr=(nr+P.H)%P.H;nc=(nc+P.W)%P.W;wrap=true}return[nr,nc,wrap]}
const melted=(P,st,i)=>P.melt.has(i)&&st.mv>=MELT;
// Eisblock (klein oder groß) rutscht, bis ihn etwas stoppt. Ergebnis sunk: deep (weg), fill (Loch wird Boden), wall (großer Block wird zur Mauer)
function pushCube(P,st,cr,cc,d,big){ // big: false=klein, true=groß, 3=Stachelblock
  const{g,W}=P,i0=cr*W+cc,c3=st.cb3.find(x=>(x>>2)===i0),others=new Set([...st.cb,...st.cb2,...st.cb3.map(x=>x>>2)].filter(x=>x!==i0));
  let r=cr,c=cc,moved=false,sunk=false;const path=[{r,c,d}],seen=new Set();
  for(;;){
    const sk=(r*W+c)*4+d;if(seen.has(sk))return null;seen.add(sk);
    const n=nxt(P,r,c,d);if(!n)break;const[nr,nc,wrap]=n,idx=nr*W+nc,t=g[nr][nc];
    if(WALL.includes(t)||t==='G'||t==='S'||t==='x'||t in DSPIKE||others.has(idx)||(nr===st.r&&nc===st.c))break;
    if(t==='l'&&!st.lk[P.locks.get(idx)])break;
    if(t==='u'&&st.fl[P.water.get(idx)]===2)break;
    if(t==='r')break;
    if(t==='*'&&!st.it[P.items.get(idx)])break;   // Blöcke verdecken nie Kristalle
    if(t==='q'&&!st.ky[P.keys.get(idx)])break;    // ... und nie Schlüssel
    r=nr;c=nc;moved=true;path.push({r,c,d,wrap});
    if(t==='~'||melted(P,st,idx)){sunk='deep';break}
    if(t==='u'){const wi=P.water.get(idx);if(!st.fl[wi]){st.fl[wi]=big===true?2:1;sunk=big===true?'wall':'fill';break}continue}
    if(t==='%'){const ci=P.crack.get(idx);if(st.br[ci]===1){sunk='deep';break}st.br[ci]=1;path[path.length-1].crack=1;continue}
    if(t==='_')break;
    if(t in ARROW){d=ARROW[t];continue}
    if(TELE.includes(t)){const p=P.partner.get(idx);if(p){const pi=p[0]*W+p[1];if(!others.has(pi)&&!(p[0]===st.r&&p[1]===st.c)){r=p[0];c=p[1];path.push({r,c,d,tele:true})}}continue}
  }
  // Blöcke bleiben nie auf Pfeilen oder Teleportern liegen: sie halten davor an
  if(!sunk)while(path.length>1&&(g[r][c] in ARROW||TELE.includes(g[r][c]))){path.pop();const q=path[path.length-1];r=q.r;c=q.c}
  if(path.length<2)return null;
  if(big===3){const rest=st.cb3.filter(x=>x!==c3);if(!sunk)rest.push((r*W+c)*4+(c3&3));rest.sort((a,b)=>a-b);st.cb3=rest;return{path,sunk,big:3,sdir:c3&3}}

const FIX_RM='#kKx~u%rnsew_1234oOl';
function fixSearch(){if(E.fix)fixClose();const g0=E.g.map(r=>r.slice()),H=g0.length,W=g0[0].length,base=edLevel(),cands=[];
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){const ch=g0[r][c];if(E.sec[r][c]!=='.')continue;
    if(ch==='.'){cands.push([[r,c,'.','k']]);cands.push([[r,c,'.','_']])}else if(FIX_RM.includes(ch))cands.push([[r,c,ch,'.']])}
  const found=[],t0=Date.now(),adds=cands.filter(x=>x[0][2]==='.');let i=0,phase=1,pairs=0,stop=false;const R=rng(H*131+W);
  const tryC=ch=>{const g=g0.map(r=>r.slice());ch.forEach(([r,c,,n])=>g[r][c]=n);const s=solve(prep({...base,map:g.map(r=>r.join(''))}),null,25000);if(s.path&&s.path.length>0)found.push({g,ch,par:s.path.length})};
  dialog(`<b>🪄 ${t('fixT')}</b><div class="fixprog"><div id="fixBar"></div></div><div id="fixTxt" style="font-size:8px;margin-top:6px">0%</div>`,[{t:t('cancel'),fn:()=>{stop=true}}]);
  function chunk(){if(stop||!E)return;const ts=Date.now();
    while(Date.now()-ts<45){if(phase===1){if(i>=cands.length){phase=found.length?3:2;break}tryC(cands[i++])}
      else if(phase===2){if(pairs>=900||Date.now()-t0>25000||found.length>=4||adds.length<2){phase=3;break}const a=adds[Math.floor(R()*adds.length)],b2=adds[Math.floor(R()*adds.length)];

    const pct=phase===1?Math.round(i/cands.length*(found.length?100:60)):phase===2?60+Math.round(Math.min(1,pairs/900)*40):100;
    if($('fixBar')){$('fixBar').style.width=pct+'%';$('fixTxt').textContent=pct+'% · '+t('fixFound',{n:found.length})}
    if(phase<3){setTimeout(chunk,0);return}
    if(!found.length){dialog(t('fixNone'));return}
    const seen=new Set();const list=found.sort((a,b)=>a.ch.length-b.ch.length||b.par-a.par||a.ch.filter(x=>x[3]==='.').length-b.ch.filter(x=>x[3]==='.').length).filter(f=>{const k=f.ch.map(x=>x.join()).sort().join('|');if(seen.has(k))return false;seen.add(k);return true}).slice(0,5);
    closeDlg();E.fix={list,i:0,show:true};fixBar();edDraw()}
  setTimeout(chunk,60)}

function secretIssues(L){if(!L.sec)return[];const P=prep(L),need=[];L.sec.forEach((row,r)=>[...row].forEach((v,c)=>{if(v!=='.')need.push([r,c])}));if(!need.length)return[];
  const st0=initState(P),ids=new Map([[skey(st0),0]]),SS=[st0],adj=[[]],launch=need.map(()=>[]);let qi=0;
  while(qi<SS.length&&qi<60000){const st=SS[qi];for(let d=0;d<4;d++){const s2=step(P,st,d);if(s2.res!=='move')continue;const k=skey(s2.st);let id=ids.get(k);if(id==null){id=SS.length;ids.set(k,id);SS.push(s2.st);adj.push([])}adj[qi].push(id);
    if(s2.path.length>1&&!s2.cube&&P.g[s2.st.r][s2.st.c]!=='_'){const nn=nxt(P,s2.st.r,s2.st.c,s2.path[s2.path.length-1].d);if(nn)need.forEach((x,j)=>{if(x[0]===nn[0]&&x[1]===nn[1])launch[j].push([qi,id])})}}qi++}
  const reach=(from,T)=>{const seen=new Set([from]),q=[from];while(q.length){const a=q.pop();if(T.has(a))return true;for(const b of adj[a]||[])if(!seen.has(b)){seen.add(b);q.push(b)}}return false};
  return need.filter((x,j)=>{const l=launch[j],fr=new Set(l.map(e=>e[0]));return!l.some(([a,h])=>reach(h,fr))})}
